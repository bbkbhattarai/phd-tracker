
name: Refresh PhD opportunity leads

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public research leads
        run: python scripts/collect.py

      - name: Commit refreshed feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json

          if ! git diff --cached --quiet; then
            git commit -m "Update PhD opportunity feed"
            git push origin HEAD:main
          fi
